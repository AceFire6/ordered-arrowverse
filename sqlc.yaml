version: "2"

# https://docs.sqlc.dev/en/stable/reference/config.html#sql
sql:
  - engine: "postgresql"
    schema: "./migrations/"
    queries: "./internal/db/queries/"
    strict_function_checks: true
    strict_order_by: true

    # https://docs.sqlc.dev/en/stable/reference/config.html#database
    database:
      uri: ${DATABASE_URL}

    rules:
      # https://docs.sqlc.dev/en/stable/howto/vet.html#sqlc-db-prepare
      - sqlc/db-prepare

    gen:
      go:
        sql_package: "pgx/v5"
        package: "db"
        out: "./internal/db/"

        omit_unused_structs: true
        emit_interface: true
        output_batch_file_name: batch_sqlc.go
        output_copyfrom_file_name: copyfrom_sqlc.go
        output_db_file_name: db_sqlc.go
        output_models_file_name: models_sqlc.go
        output_querier_file_name: querier_sqlc.go
        output_files_suffix: _sqlc

        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
