name: Test

on:
  pull_request:
    branches: [main, arrowverse-v2]
  push:
    branches: [main, arrowverse-v2]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_DB: arrowverse
          POSTGRES_USER: arrowverse
          POSTGRES_PASSWORD: arrowverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arrowverse -d arrowverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://arrowverse:arrowverse@localhost:5432/arrowverse?sslmode=disable
      REDIS_URL: redis://localhost:6379
      SERVICE_NAME: arrowverse-test
      ENVIRONMENT: development

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Go via mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
    - name: Install codegen tools
      run: |
        go install github.com/a-h/templ/cmd/templ@v0.3.943
        go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
        go install github.com/jackc/tern/v2@latest
    - name: Cache go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-test-${{ hashFiles('**/go.sum', '**/tools/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-test-
    - name: Generate templ + sqlc
      run: |
        templ generate -path ./components
        sqlc generate -f ./sqlc.yaml
    - name: Apply migrations
      run: tern migrate --migrations ./migrations
    - name: Run unit tests
      run: go test -race -count=1 ./...
